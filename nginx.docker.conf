server {
    listen 80;
    server_name localhost;

    # Thư mục chứa Frontend React đã build
    root /var/www/client/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 50M;

    # 1. Tối ưu Gzip nén dữ liệu cho React & API
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 2. Security Headers cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 3. Định tuyến toàn bộ API sang Laravel Backend
    location ^~ /api {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
        fastcgi_buffering off;
        fastcgi_read_timeout 300;
    }

    # 4. Truy cập hình ảnh/tệp tin upload từ Storage Laravel
    location ^~ /storage {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
    }

    # 5. Cache trình duyệt cho tài nguyên tĩnh của React (JS, CSS, Font, Ảnh)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # 6. Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 7. Chặn truy cập file ẩn hệ thống (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

